<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GOES Loop Viewer</title>
  <meta name="theme-color" content="#131a22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GOES Loops">
  
  
  <link rel="stylesheet" href="/static/css/goes.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="goes-title-wrap"><a class="back-to-fishing" href="/" target="_top">← Fishing App</a><h1 id="sectorTitle">GOES Loop Viewer</h1></div>
      <div class="topbar-meta">
        <span id="clock" class="clock">--:--</span>
        <button id="installBtn" class="install-btn" type="button" hidden>Install</button>
        <button id="refreshBtn" class="icon-btn" title="Refresh all loops" aria-label="Refresh all loops">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
    </div>

    <nav class="sector-row" id="sectorRow" aria-label="Switch sector">
      {% for s in sectors %}
      <button class="sector-tab{% if s.key == default_sector %} active{% endif %}" data-sector="{{ s.key }}">{{ s.label }}</button>
      {% endfor %}
    </nav>

    <nav class="filter-row" id="filterRow" aria-label="Filter by category">
      <button class="filter-chip active" data-filter="All">All</button>
      <button class="filter-chip" data-filter="RGB">RGB</button>
      <button class="filter-chip" data-filter="Single Band">Bands</button>
    </nav>
  </header>

  <main id="grid" class="grid">
    <!-- Cards injected by app.js -->
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-inner">
      <button id="modalClose" class="icon-btn modal-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.7l-1.41-1.41L9.17 12 2.88 5.71 4.29 4.3l6.3 6.29 6.3-6.29z"/></svg>
      </button>
      <h2 id="modalTitle"></h2>
      <div class="modal-image-wrap">
        <img id="modalImage" src="" alt="">
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>Imagery: NOAA / NESDIS / STAR GOES Image Viewer — Andy Talbert - BamaoneWx</p>
  </footer>

  <script>
    window.DEFAULT_SECTOR = {{ default_sector | tojson }};
  </script>
  <script src="/static/js/goes.js"></script>
</body>
</html>
